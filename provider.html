<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provider Dashboard — Serviro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body data-page="provider" class="text-slate-100 min-h-screen">

  <!-- NAV -->
  <nav class="nav-glass sticky top-0 z-40 px-4 sm:px-6 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" fill="white"/></svg>
        </div>
        <span class="font-display font-bold text-lg">Serv<span class="gradient-text">iro</span></span>
        <span class="chip hidden sm:inline-flex">Provider</span>
      </div>

      <div class="hidden md:flex items-center gap-4">
        <div class="text-right">
          <p class="user-name-slot text-sm font-semibold leading-tight">—</p>
          <p class="user-email-slot text-[11px] text-slate-500 leading-tight">—</p>
        </div>
        <img class="user-avatar-slot w-9 h-9 rounded-full bg-slate-800 border border-slate-700" alt="avatar">
        <button onclick="app.logout()" class="btn btn-ghost !px-3 !py-2">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Logout
        </button>
      </div>

      <button onclick="app.toggleMobileMenu()" class="md:hidden btn btn-ghost btn-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="mobile-menu" class="hidden md:hidden mt-4 pt-4 border-t border-slate-800 flex items-center justify-between">
      <div>
        <p class="user-name-slot text-sm font-semibold">—</p>
        <p class="user-email-slot text-[11px] text-slate-500">—</p>
      </div>
      <button onclick="app.logout()" class="btn btn-ghost !px-3 !py-2">Logout</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">

    <div class="reveal">
      <h1 class="font-display text-2xl sm:text-3xl font-bold">Your <span class="gradient-text">complaints</span> queue</h1>
      <p class="text-slate-400 text-sm mt-1.5">Accept complaints, track resolution progress and close them out.</p>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 sm:gap-4 mt-6">
      <div class="card reveal rounded-2xl p-4">
        <div class="stat-icon bg-amber-500/15 text-amber-400 mb-2.5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
        <p id="stat-pending" class="font-display text-xl font-bold">0</p>
        <p class="text-[11px] text-slate-500">Pending</p>
      </div>
      <div class="card reveal rounded-2xl p-4" style="transition-delay:40ms">
        <div class="stat-icon bg-blue-500/15 text-blue-400 mb-2.5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <p id="stat-accepted" class="font-display text-xl font-bold">0</p>
        <p class="text-[11px] text-slate-500">Accepted</p>
      </div>
      <div class="card reveal rounded-2xl p-4" style="transition-delay:80ms">
        <div class="stat-icon bg-violet-500/15 text-violet-400 mb-2.5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2v20M2 12h20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
        <p id="stat-progress" class="font-display text-xl font-bold">0</p>
        <p class="text-[11px] text-slate-500">In Progress</p>
      </div>
      <div class="card reveal rounded-2xl p-4" style="transition-delay:120ms">
        <div class="stat-icon bg-emerald-500/15 text-emerald-400 mb-2.5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4m5 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="1.8"/></svg></div>
        <p id="stat-completed" class="font-display text-xl font-bold">0</p>
        <p class="text-[11px] text-slate-500">Resolved</p>
      </div>
      <div class="card reveal rounded-2xl p-4" style="transition-delay:160ms">
        <div class="stat-icon bg-rose-500/15 text-rose-400 mb-2.5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></div>
        <p id="stat-rejected" class="font-display text-xl font-bold">0</p>
        <p class="text-[11px] text-slate-500">Rejected</p>
      </div>
    </div>

    <div id="provider-complaints-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mt-8"></div>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
