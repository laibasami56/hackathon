<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Dashboard — Serviro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body data-page="customer" class="text-slate-100 min-h-screen">

  <!-- NAV -->
  <nav class="nav-glass sticky top-0 z-40 px-4 sm:px-6 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" fill="white"/></svg>
        </div>
        <span class="font-display font-bold text-lg">Serv<span class="gradient-text">iro</span></span>
        <span class="chip hidden sm:inline-flex">Customer</span>
      </div>

      <div class="hidden md:flex items-center gap-4">
        <div class="text-right">
          <p class="user-name-slot text-sm font-semibold leading-tight">—</p>
          <p class="user-email-slot text-[11px] text-slate-500 leading-tight">—</p>
        </div>
        <img class="user-avatar-slot w-9 h-9 rounded-full bg-slate-800 border border-slate-700" alt="avatar">
        <button onclick="app.logout()" class="btn btn-ghost !px-3 !py-2">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Logout
        </button>
      </div>

      <button onclick="app.toggleMobileMenu()" class="md:hidden btn btn-ghost btn-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="mobile-menu" class="hidden md:hidden mt-4 pt-4 border-t border-slate-800 flex items-center justify-between">
      <div>
        <p class="user-name-slot text-sm font-semibold">—</p>
        <p class="user-email-slot text-[11px] text-slate-500">—</p>
      </div>
      <button onclick="app.logout()" class="btn btn-ghost !px-3 !py-2">Logout</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">

    <!-- Hero -->
    <div class="reveal">
      <h1 class="font-display text-2xl sm:text-3xl font-bold">Find your next <span class="gradient-text">IT expert</span></h1>
      <p class="text-slate-400 text-sm mt-1.5">Browse vetted developers, designers and IT specialists, then file a complaint to get it resolved.</p>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-3 sm:gap-4 mt-6">
      <div class="card reveal rounded-2xl p-4 sm:p-5">
        <div class="stat-icon bg-indigo-500/15 text-indigo-400 mb-3">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.8"/></svg>
        </div>
        <p id="stat-total" class="font-display text-2xl font-bold">0</p>
        <p class="text-xs text-slate-500 mt-0.5">Total Complaints</p>
      </div>
      <div class="card reveal rounded-2xl p-4 sm:p-5" style="transition-delay:60ms">
        <div class="stat-icon bg-violet-500/15 text-violet-400 mb-3">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <p id="stat-active" class="font-display text-2xl font-bold">0</p>
        <p class="text-xs text-slate-500 mt-0.5">Active Complaints</p>
      </div>
      <div class="card reveal rounded-2xl p-4 sm:p-5" style="transition-delay:120ms">
        <div class="stat-icon bg-emerald-500/15 text-emerald-400 mb-3">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <p id="stat-completed" class="font-display text-2xl font-bold">0</p>
        <p class="text-xs text-slate-500 mt-0.5">Resolved</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex items-center gap-2 mt-8 reveal">
      <button id="customer-tab-browse" onclick="app.setCustomerTab('browse')" class="btn btn-primary !px-4 !py-2 text-xs">Browse Providers</button>
      <button id="customer-tab-mycomplaints" onclick="app.setCustomerTab('mycomplaints')" class="btn btn-ghost !px-4 !py-2 text-xs">My Complaints</button>
    </div>

    <!-- Browse Panel -->
    <section id="panel-browse" class="mt-6">
      <!-- Search & Filter -->
      <div class="card rounded-2xl p-4 flex flex-col sm:flex-row gap-3 reveal">
        <div class="relative flex-1">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search-input" oninput="app.filterProviders()" class="input !pl-10" placeholder="Search by name, service or skill…">
        </div>
        <select id="filter-service" onchange="app.filterProviders()" class="input sm:max-w-[220px]"></select>
      </div>

      <div id="providers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mt-6"></div>
    </section>

    <!-- My Complaints Panel -->
    <section id="panel-mycomplaints" class="mt-6 hidden">
      <div id="mycomplaints-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
